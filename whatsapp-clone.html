<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WhatsApp</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
* {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  background: #111; display: flex; justify-content: center; align-items: center;
  min-height: 100vh; overflow: hidden;
}
#root { width: 100%; max-width: 430px; height: 100vh; max-height: 932px;
  background: #fff; position: relative; overflow: hidden;
  box-shadow: 0 0 40px rgba(0,0,0,0.3); }
@media (min-width: 431px) {
  #root { border-radius: 20px; height: 90vh; margin: 20px auto; }
}

/* Animations */
@keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.08)} 100%{transform:scale(1)} }
@keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
@keyframes slideIn { from{transform:translateX(100%)} to{transform:translateX(0)} }
@keyframes slideOut { from{transform:translateX(0)} to{transform:translateX(100%)} }
@keyframes waveAnim { 0%,100%{transform:scaleY(0.5)} 50%{transform:scaleY(1)} }
@keyframes ringPulse { 0%{box-shadow:0 0 0 0 rgba(37,211,102,0.6)} 50%{box-shadow:0 0 0 30px rgba(37,211,102,0)} 100%{box-shadow:0 0 0 0 rgba(37,211,102,0)} }
@keyframes statusProgress { from{width:0%} to{width:100%} }
@keyframes callingPulse { 0%{transform:scale(1);opacity:.5} 50%{transform:scale(1.1);opacity:.8} 100%{transform:scale(1);opacity:.5} }
.fade-in { animation: fadeIn 0.3s ease forwards; }
.slide-up { animation: slideUp 0.35s ease forwards; }

/* Chat bg pattern */
.chat-bg {
  background-color: #ECE5DD;
  background-image: 
    radial-gradient(circle at 20px 20px, rgba(0,0,0,0.03) 2px, transparent 2px),
    radial-gradient(circle at 60px 80px, rgba(0,0,0,0.03) 3px, transparent 3px),
    radial-gradient(circle at 100px 40px, rgba(0,0,0,0.03) 2px, transparent 2px),
    radial-gradient(circle at 140px 120px, rgba(0,0,0,0.03) 2px, transparent 2px);
  background-size: 160px 160px;
}

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }

/* OTP inputs */
.otp-input { width: 45px; height: 55px; border: none; border-bottom: 2px solid #ddd;
  font-size: 24px; text-align: center; outline: none; transition: border-color 0.2s; }
.otp-input:focus { border-bottom-color: #25D366; }

/* Tab bar */
.tab-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 64px;
  background: #fff; border-top: 1px solid #e0e0e0; display: flex;
  justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); }
.tab-item { display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; cursor: pointer; padding: 6px 12px; position: relative; flex: 1; }
.tab-icon { font-size: 22px; line-height: 1; }
.tab-label { font-size: 11px; color: #888; }
.tab-label.active { color: #075E54; font-weight: 600; }
.tab-indicator { position: absolute; top: -1px; left: 20%; right: 20%; height: 2px;
  background: #075E54; border-radius: 0 0 2px 2px; }

/* FAB */
.fab { position: absolute; bottom: 80px; right: 16px; width: 58px; height: 58px;
  border-radius: 50%; background: #25D366; color: #fff; border: none;
  font-size: 24px; box-shadow: 0 4px 12px rgba(37,211,102,0.4);
  cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; }
.fab:active { transform: scale(0.95); }

/* Chat item */
.chat-item { display: flex; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #f0f0f0; }
.chat-item:active { background: #f5f5f5; }
.chat-avatar { width: 50px; height: 50px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; color: #fff; font-weight: 600;
  font-size: 18px; flex-shrink: 0; }
.chat-info { flex: 1; margin-left: 12px; overflow: hidden; }
.chat-name { font-weight: 500; font-size: 16px; color: #111; }
.chat-msg { font-size: 13px; color: #666; margin-top: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-meta { text-align: right; flex-shrink: 0; margin-left: 8px; }
.chat-time { font-size: 11px; color: #999; white-space: nowrap; }
.unread-badge { background: #25D366; color: #fff; font-size: 11px; font-weight: 600;
  min-width: 18px; height: 18px; border-radius: 9px; display: flex;
  align-items: center; justify-content: center; margin-top: 5px;
  margin-left: auto; padding: 0 5px; }

/* Messages */
.msg-row { display: flex; margin-bottom: 4px; padding: 0 12px; }
.msg-row.sent { justify-content: flex-end; }
.msg-bubble { max-width: 75%; padding: 8px 10px; font-size: 14px;
  line-height: 1.4; position: relative; word-wrap: break-word; }
.msg-bubble.received { background: #fff; border-radius: 0 12px 12px 12px;
  box-shadow: 0 1px 1px rgba(0,0,0,0.06); }
.msg-bubble.sent { background: #DCF8C6; border-radius: 12px 0 12px 12px;
  box-shadow: 0 1px 1px rgba(0,0,0,0.06); }
.msg-time { font-size: 10px; color: #999; float: right; margin-left: 8px;
  margin-top: 4px; display: flex; align-items: center; gap: 2px; }

/* Voice bubble */
.voice-bubble { display: flex; align-items: center; gap: 8px; min-width: 180px; }
.voice-play { width: 32px; height: 32px; border-radius: 50%; border: none;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  font-size: 14px; flex-shrink: 0; }
.voice-play.sent { background: rgba(0,0,0,0.1); color: #333; }
.voice-play.received { background: #25D366; color: #fff; }
.voice-wave { display: flex; align-items: center; gap: 2px; height: 24px; flex: 1; }
.voice-bar { width: 3px; background: currentColor; border-radius: 2px; }
.voice-dur { font-size: 11px; color: #999; white-space: nowrap; }

/* Recording UI */
.recording-ui { display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  background: #fff; border-top: 1px solid #e0e0e0; }
.recording-dot { width: 10px; height: 10px; border-radius: 50%; background: #f00;
  animation: pulse 1s infinite; }
.recording-timer { font-size: 14px; color: #333; font-weight: 500; }
.recording-wave { display: flex; align-items: center; gap: 2px; height: 30px; flex: 1; }
.recording-bar { width: 3px; background: #25D366; border-radius: 2px; }
.recording-cancel { font-size: 12px; color: #999; }

/* Bottom input */
.chat-input { display: flex; align-items: center; gap: 6px; padding: 8px 12px;
  background: #fff; border-top: 1px solid #e0e0e0; }
.chat-input input { flex: 1; height: 40px; border: none; border-radius: 22px;
  background: #f5f5f5; padding: 0 16px; font-size: 15px; outline: none; font-family: inherit; }
.chat-input button { width: 40px; height: 40px; border-radius: 50%; border: none;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  font-size: 20px; background: transparent; flex-shrink: 0; }
.chat-input .send-btn { background: #25D366; color: #fff; }

/* Settings list */
.settings-item { display: flex; align-items: center; padding: 14px 16px;
  border-bottom: 1px solid #f0f0f0; cursor: pointer; }
.settings-item:active { background: #f5f5f5; }
.settings-icon { width: 36px; height: 36px; border-radius: 8px; display: flex;
  align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.settings-info { flex: 1; margin-left: 14px; }
.settings-title { font-size: 15px; color: #111; }
.settings-subtitle { font-size: 12px; color: #888; margin-top: 2px; }
.settings-chevron { color: #ccc; font-size: 14px; }

/* Status rings */
.status-ring { width: 54px; height: 54px; border-radius: 50%; padding: 3px;
  display: flex; align-items: center; justify-content: center; }
.status-ring.unviewed { background: conic-gradient(#25D366 0deg 360deg, #ddd 0deg 360deg); }
.status-ring.viewed { background: #ccc; }

/* Call log */
.call-item { display: flex; padding: 12px 16px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
.call-avatar { width: 48px; height: 48px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; color: #fff; font-weight: 600;
  font-size: 16px; flex-shrink: 0; }
.call-info { flex: 1; margin-left: 12px; }
.call-name { font-size: 16px; font-weight: 500; }
.call-type { font-size: 13px; margin-top: 2px; display: flex; align-items: center; gap: 4px; }
.call-type.missed { color: #f44336; }
.call-type.incoming { color: #25D366; }
.call-type.outgoing { color: #075E54; }
.call-meta { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.call-date { font-size: 12px; color: #999; white-space: nowrap; }
.call-icon-btn { color: #25D366; font-size: 20px; cursor: pointer; }

/* Overlay screens */
.overlay { position: absolute; inset: 0; z-index: 100; background: #000; }
</style>
</head>

// ===== SCREEN 4: OTP =====
function OtpScreen({ phone, onBack, onVerified }) {
  const [otp, setOtp] = useState(['','','','','','']);
  const [timer, setTimer] = useState(30);
  const [verifying, setVerifying] = useState(false);
  const refs = useRef([]);
  useEffect(() => {
    if (timer <= 0) return;
    const t = setInterval(() => setTimer(p => p-1), 1000);
    return () => clearInterval(t);
  }, [timer]);
  const handleChange = (i, v) => {
    if (!/^\d*$/.test(v)) return;
    const n = [...otp]; n[i] = v.slice(-1); setOtp(n);
    if (v && i < 5) refs.current[i+1]?.focus();
  };
  const handleKey = (i, e) => {
    if (e.key === 'Backspace' && !otp[i] && i > 0) refs.current[i-1]?.focus();
  };
  const allFilled = otp.every(d => d);
  useEffect(() => {
    if (allFilled) { setVerifying(true); setTimeout(() => { setVerifying(false); onVerified(); }, 1500); }
  }, [allFilled]);
  return (
    <div style={{ position:'absolute',inset:0,background:'#fff' }}>
      <div style={{ background:C.header,padding:'50px 16px 16px',display:'flex',alignItems:'center' }}>

// ===== MESSAGE BUBBLE =====
function VoiceBubble({ sent }) {
  const [playing, setPlaying] = useState(false);
  const bars = [12,18,8,22,14,20,10,16,24,14,18,8,22,12,16,10,20,14,18,8];
  return (
    <div className="voice-bubble">
      <button className={`voice-play ${sent?'sent':'received'}`} onClick={() => setPlaying(!playing)}>
        {playing ? '⏸' : '▶️'}
      </button>
      <div className="voice-wave" style={{color:sent?'#333':'#25D366'}}>
        {bars.map((h,i) => (
          <div key={i} className="voice-bar" style={{height:h,animation:playing?`waveAnim 0.8s ease ${i*0.05}s infinite`:'none'}} />
        ))}
      </div>
      <span className="voice-dur">0:12</span>
    </div>
  );
}

function MsgBubble({ msg }) {
  if (msg.voice) {
    return (
      <div className={`msg-row ${msg.type}`}>
        <div className={`msg-bubble ${msg.type}`}>
          <VoiceBubble sent={msg.type==='sent'} />
          <div className="msg-time"><span>{msg.time}</span></div>
        </div>
      </div>
    );
  }
  return (
    <div className={`msg-row ${msg.type}`}>
      <div className={`msg-bubble ${msg.type}`}>
        {msg.text}
        <span className="msg-time">
          {msg.time}
          {msg.ticks === 'blue' && <span style={{color:'#53BDEB',fontSize:11,marginLeft:2}}>✓✓</span>}
          {msg.ticks === 'gray' && <span style={{color:'#999',fontSize:11,marginLeft:2}}>✓✓</span>}
        </span>
      </div>
    </div>
  );
}

// ===== SCREEN 7: CHAT SCREEN =====
function ChatScreen({ chat, onBack, onAudioCall, onVideoCall, onSettings, onContactDetail }) {
  const [msg, setMsg] = useState('');
  const [messages, setMessages] = useState(F.chatMessages);
  const [recording, setRecording] = useState(false);
  const [recTime, setRecTime] = useState(0);
  const [cancelRec, setCancelRec] = useState(false);
  const [showMenu, setShowMenu] = useState(false);
  const menuRef = useRef(null);
  const recTimer = useRef(null);
  const chatEnd = useRef(null);
  useEffect(() => { const handler = (e) => { if (menuRef.current && !menuRef.current.contains(e.target)) setShowMenu(false); }; document.addEventListener('mousedown', handler); return () => document.removeEventListener('mousedown', handler); }, []);
  useEffect(() => { chatEnd.current?.scrollIntoView({behavior:'smooth'}); }, [messages]);
  const sendMsg = () => {
    if (!msg.trim()) return;
    setMessages(p => [...p, { type:'sent', text:msg.trim(), time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}), ticks:'gray' }]);
    setMsg('');
  };
  const startRec = () => {
    setRecording(true); setRecTime(0);
    recTimer.current = setInterval(() => setRecTime(p => p+1), 1000);
  };
  const stopRec = () => {
    clearInterval(recTimer.current); setRecording(false);
    if (!cancelRec && recTime > 1) {
      setMessages(p => [...p, { type:'sent', voice:true, time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) }]);
    }
    setCancelRec(false);
  };
  const cancelRecording = () => { clearInterval(recTimer.current); setRecording(false); setCancelRec(false); setRecTime(0); };
  const bars = [6,10,14,20,16,22,12,18,24,14,8,16,20,10,14,18,12,22,16,8];
  return (
    <div style={{ position:'absolute',inset:0,display:'flex',flexDirection:'column' }}>
      <div style={{ background:C.header,padding:'44px 8px 10px',display:'flex',alignItems:'center',gap:4,zIndex:2 }}>
        <span onClick={onBack} style={{color:'#fff',fontSize:22,cursor:'pointer',padding:'4px 6px',lineHeight:1}}>←</span>
        <div style={{width:36,height:36,borderRadius:'50%',background:chat.color,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:14,fontWeight:600,flexShrink:0}}>{chat.initials}</div>
        <div style={{flex:1,marginLeft:4}}>
          <div style={{color:'#fff',fontSize:15,fontWeight:500}}>{chat.name}</div>
          <div style={{color:'rgba(255,255,255,0.8)',fontSize:11}}>online</div>
        </div>
        <span onClick={onVideoCall} style={{color:'#fff',fontSize:18,cursor:'pointer',padding:'4px 6px'}}>📹</span>
        <span onClick={onAudioCall} style={{color:'#fff',fontSize:18,cursor:'pointer',padding:'4px 6px'}}>📞</span>
        <div style={{position:'relative'}} ref={menuRef}>
          <span onClick={() => setShowMenu(!showMenu)} style={{color:'#fff',fontSize:18,cursor:'pointer',padding:'4px 6px',fontWeight:'bold'}}>⋮</span>
          {showMenu && (
            <div style={{position:'absolute',top:32,right:0,background:'#fff',borderRadius:8,boxShadow:'0 2px 12px rgba(0,0,0,0.15)',zIndex:100,minWidth:160,overflow:'hidden'}}>
              {['View contact','Media, links, and docs','Search','Mute notifications','Disappearing messages','Wallpaper','More'].map((item, i) => (
                <div key={i} onClick={() => { setShowMenu(false); if (i===0 && onContactDetail) onContactDetail(); else alert(`📋 ${item}`); }} style={{padding:'12px 16px',fontSize:14,color:'#333',cursor:'pointer',borderBottom:i<6?'1px solid #f0f0f0':'none'}}>{item}</div>
              ))}
            </div>
          )}
        </div>
      </div>
      <div className="chat-bg" style={{ flex:1,overflow:'auto',padding:'8px 0' }}>
        {messages.map((m,i) => <MsgBubble key={i} msg={m} />)}
        <div ref={chatEnd} />
      </div>
      {recording ? (
        <div className="recording-ui">
          <div className="recording-dot" />
          <span className="recording-timer">0:{String(recTime).padStart(2,'0')}</span>
          <div className="recording-wave">
            {bars.map((h,i) => <div key={i} className="recording-bar" style={{height:h,animation:`waveAnim 0.6s ease ${i*0.04}s infinite`}} />)}
          </div>
          <span onClick={cancelRecording} style={{fontSize:13,color:'#999',cursor:'pointer',whiteSpace:'nowrap'}}>✕ Cancel</span>
        </div>
      ) : (
        <div className="chat-input">
          <span onClick={() => alert('😊 Emoji picker')} style={{fontSize:22,cursor:'pointer',flexShrink:0}}>😊</span>
          <input value={msg} onChange={e => setMsg(e.target.value)} onKeyDown={e => e.key==='Enter' && sendMsg()}
            placeholder="Message" />
          <span onClick={() => alert('📎 Attach file')} style={{fontSize:20,cursor:'pointer',flexShrink:0}}>📎</span>
          <span onClick={() => alert('📷 Open camera')} style={{fontSize:20,cursor:'pointer',flexShrink:0}}>📷</span>
          {msg.trim() ? (
            <button className="send-btn" onClick={sendMsg} style={{fontSize:18}}>➤</button>
          ) : (
            <button onMouseDown={startRec} onMouseUp={stopRec} onTouchStart={startRec} onTouchEnd={stopRec}
              style={{background:C.accent,color:'#fff',width:40,height:40,borderRadius:'50%',border:'none',fontSize:20,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>🎤</button>
          )}
        </div>
      )}
    </div>
  );
}

// ===== SCREEN 9: AUDIO CALL =====
function AudioCallScreen({ contact, onEnd }) {
  const [status, setStatus] = useState(0);
  const [sec, setSec] = useState(0);
  const [speakerOn, setSpeakerOn] = useState(false);
  const [muted, setMuted] = useState(false);
  useEffect(() => {
    if (status < 3) { const t = setTimeout(() => setStatus(s => Math.min(s+1,3)), 3000); return () => clearTimeout(t); }
  }, [status]);
  useEffect(() => {
    if (status < 3) return;
    const t = setInterval(() => setSec(s => s+1), 1000);
    return () => clearInterval(t);
  }, [status]);
  const statusText = ['Calling...','Ringing...','Ringing...','Connected '][status] +
    (status >= 3 ? `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}` : '');
  return (
    <div className="overlay" style={{background:'linear-gradient(135deg,#0a0a0a 0%,#1a1a2e 50%,#16213e 100%)'}}>
      <span onClick={onEnd} style={{position:'absolute',top:50,left:16,color:'#fff',fontSize:22,cursor:'pointer',zIndex:10}}>←</span>
      <div style={{position:'absolute',top:55,left:50,color:'rgba(255,255,255,0.6)',fontSize:11}}>WhatsApp Voice Call</div>
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100%'}}>
        <div style={{fontSize:32,fontWeight:600,color:'#fff',marginTop:40}}>{contact.name}</div>
        <div style={{fontSize:13,color:'rgba(255,255,255,0.6)',marginTop:8}}>{statusText}</div>
        <div style={{position:'relative',marginTop:50}}>
          {status < 3 && <div style={{position:'absolute',inset:-8,borderRadius:'50%',background:'transparent',boxShadow:'0 0 0 0 rgba(37,211,102,0.4)',animation:'ringPulse 1.5s infinite'}} />}
          <div style={{width:120,height:120,borderRadius:'50%',background:contact.color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:48,color:'#fff',fontWeight:600,animation:status<3?'callingPulse 1.5s ease-in-out infinite':'none',zIndex:1,position:'relative'}}>
            {contact.initials}
          </div>
        </div>
      </div>
      <div style={{position:'absolute',bottom:60,left:0,right:0,display:'flex',justifyContent:'center',gap:20}}>
        <div style={{textAlign:'center'}}><div onClick={() => setSpeakerOn(!speakerOn)} style={{width:55,height:55,borderRadius:'50%',background:speakerOn?C.accent:'rgba(255,255,255,0.15)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,cursor:'pointer'}}>🔊</div><div style={{fontSize:11,color:'rgba(255,255,255,0.6)',marginTop:4}}>Speaker</div></div>
        <div style={{textAlign:'center'}}><div onClick={() => setMuted(!muted)} style={{width:55,height:55,borderRadius:'50%',background:muted?'rgba(255,255,255,0.2)':'rgba(255,255,255,0.15)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,cursor:'pointer'}}>{muted?'🔇':'🎤'}</div><div style={{fontSize:11,color:'rgba(255,255,255,0.6)',marginTop:4}}>Mute</div></div>
        <div style={{textAlign:'center'}}><div onClick={onEnd} style={{width:65,height:65,borderRadius:'50%',background:'#f44336',display:'flex',alignItems:'center',justifyContent:'center',fontSize:28,cursor:'pointer',border:'none'}}>🔴</div><div style={{fontSize:11,color:'rgba(255,255,255,0.6)',marginTop:4}}>End</div></div>
        <div style={{textAlign:'center'}}><div style={{width:55,height:55,borderRadius:'50%',background:'rgba(255,255,255,0.15)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,cursor:'pointer'}}>📹</div><div style={{fontSize:11,color:'rgba(255,255,255,0.6)',marginTop:4}}>Video</div></div>
      </div>
    </div>
  );
}

          {statusList.map((s,i) => (
            <div key={i} className="chat-item" onClick={() => onViewStatus(i)}>
              <div style={{position:'relative',width:52,height:52,flexShrink:0}}>
                <div style={{width:52,height:52,padding:3,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center'}}>
                  <div className={`status-ring ${s.viewed?'viewed':'unviewed'}`} style={{padding:3}}>
                    <div style={{width:'100%',height:'100%',borderRadius:'50%',background:s.color || avatarColors[i],display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontWeight:600,fontSize:16}}>{s.name[0]}</div>
                  </div>
                </div>
              </div>
              <div className="chat-info">
                <div className="chat-name">{s.name}</div>
                <div className="chat-msg">{s.time}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
      <TabBar active="updates" onTab={onTab} />
    </div>
  );
}

// ===== SCREEN 12: STATUS VIEWER =====
function StatusViewer({ statuses, index, onClose }) {
  const [cur, setCur] = useState(index);
  const [progress, setProgress] = useState(0);
  const s = statuses[cur];
  useEffect(() => {
    setProgress(0);
    const dur = 5000;
    const interval = 50;
    const step = interval / dur * 100;
    const t = setInterval(() => {
      setProgress(p => {
        const n = p + step;
        if (n >= 100) {
          clearInterval(t);
          if (cur < statuses.length - 1) setCur(c => c+1);
          else onClose();
          return 100;
        }
        return n;
      });
    }, interval);
    return () => clearInterval(t);
  }, [cur]);
  const handleClick = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    if (e.clientX - rect.left > rect.width / 2) {
      if (cur < statuses.length - 1) setCur(c => c+1);
    } else {
      if (cur > 0) setCur(c => c-1);
    }
  };
  return (
    <div style={{position:'absolute',inset:0,background:s.bg?s.bg[0]:'#000',zIndex:200,display:'flex',flexDirection:'column'}}>
      <div style={{position:'absolute',top:0,left:0,right:0,zIndex:10,padding:'50px 12px 0'}}>
        <div style={{display:'flex',gap:4,marginBottom:8}}>
          {statuses.slice(0,3).map((_, i) => (
            <div key={i} style={{flex:1,height:3,background:'rgba(255,255,255,0.3)',borderRadius:2,overflow:'hidden'}}>
              <div style={{height:'100%',background:'#fff',width:i<cur?'100%':i===cur?`${progress}%`:'0%',borderRadius:2,transition:'width 0.05s linear'}} />
            </div>
          ))}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <div style={{width:32,height:32,borderRadius:'50%',background:s.color||avatarColors[cur],display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:14,fontWeight:600}}>{s.name[0]}</div>
          <div style={{flex:1}}>
            <div style={{color:'#fff',fontSize:13}}>{s.name}</div>
            <div style={{color:'rgba(255,255,255,0.6)',fontSize:11}}>{s.time}</div>
          </div>
          <span onClick={onClose} style={{color:'#fff',fontSize:22,cursor:'pointer',padding:4}}>✕</span>
        </div>
      </div>
      <div onClick={handleClick} style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',position:'relative'}}>
        <div style={{
          background:`linear-gradient(135deg, ${s.bg?.[0]||'#25D366'}, ${s.bg?.[1]||'#075E54'})`,
          position:'absolute',inset:0,opacity:0.8
        }} />
        <div style={{fontSize:48,color:'#fff',fontWeight:500,textShadow:'0 2px 10px rgba(0,0,0,0.3)',zIndex:1,textAlign:'center',padding:20}}>
          <div>{s.content}</div>
        </div>
      </div>
      <div style={{padding:'12px 16px 24px',display:'flex',alignItems:'center',gap:8,background:'rgba(0,0,0,0.5)'}}>
        <span style={{fontSize:20,cursor:'pointer'}}>😊</span>
        <input placeholder="Reply..." style={{flex:1,height:36,border:'none',borderRadius:18,padding:'0 12px',fontSize:13,fontFamily:'inherit',background:'rgba(255,255,255,0.2)',color:'#fff',outline:'none'}} placeholderTextColor="rgba(255,255,255,0.5)" />
        <span style={{fontSize:20,cursor:'pointer'}}>❤️</span>
        <span style={{fontSize:18,cursor:'pointer'}}>↗️</span>
      </div>
    </div>
  );
}

// ===== SCREEN 13: CALLS TAB =====
function CallsScreen({ calls, onCall, onTab }) {
  const typeIcon = (t) => {
    if (t === 'incoming') return { icon:'↙', color:'#25D366' };
    if (t === 'outgoing') return { icon:'↗', color:'#075E54' };
    return { icon:'↙', color:'#f44336' };
  };
  return (
    <div style={{ position:'absolute',inset:0,background:'#fff',paddingBottom:64 }}>
      <div style={{ background:C.header,padding:'50px 16px 12px' }}>
        <span style={{color:'#fff',fontSize:20,fontWeight:600}}>Calls</span>
      </div>
      <div style={{ overflow:'auto',height:'calc(100% - 114px)' }}>
        <div style={{ padding:'16px 16px 8px' }}>
          <div style={{fontSize:13,color:'#888',marginBottom:8,fontWeight:500}}>Favorites</div>
          <div style={{display:'flex',gap:16,overflow:'auto',paddingBottom:8}}>
            <div style={{textAlign:'center',flexShrink:0}}>
              <div style={{width:48,height:48,borderRadius:'50%',background:C.accent,display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,color:'#fff',margin:'0 auto'}}>+</div>
              <div style={{fontSize:11,color:'#888',marginTop:4}}>Add</div>
            </div>
            {[{n:'Ahmed',c:'#E91E63'},{n:'Sara',c:'#9C27B0'},{n:'Fatima',c:'#FF5722'}].map((f,i) => (
              <div key={i} style={{textAlign:'center',flexShrink:0}}>
                <div style={{width:48,height:48,borderRadius:'50%',background:f.c,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:18,fontWeight:600,margin:'0 auto'}}>{f.n[0]}</div>
                <div style={{fontSize:11,color:'#888',marginTop:4}}>{f.n}</div>
              </div>
            ))}
          </div>
        </div>
        <div style={{height:6,background:'#f5f5f5'}} />
        {calls.map((c, i) => {
          const ti = typeIcon(c.type);
          return (
            <div key={i} className="call-item" onClick={() => onCall(c.name, avatarColors[i])}>
              <div className="call-avatar" style={{background:avatarColors[i]}}>{c.name[0]}</div>
              <div className="call-info">
                <div className="call-name" style={{color: c.type==='missed'?'#f44336':'#111'}}>{c.name}</div>
                <div className={`call-type ${c.type}`}>
                  <span>{ti.icon}</span>
                  <span>{c.type.charAt(0).toUpperCase()+c.type.slice(1)}{c.duration && ` · ${c.duration}`}</span>
                  {c.video && <span style={{fontSize:14}}> 📹</span>}
                </div>
              </div>
              <div className="call-meta">
                <span className="call-date">{c.date}</span>
                <span className="call-icon-btn" style={{fontSize:c.video?16:20}}>{c.video?'📹':'📞'}</span>
              </div>
            </div>
          );
        })}
      </div>
      <div className="fab" onClick={() => alert('☎️ Create call link')} style={{fontSize:20}}>☎️</div>
      <TabBar active="calls" onTab={onTab} />
    </div>
  );
}

// ===== MAIN APP =====
function App() {
  const [screen, setScreen] = useState('splash');
  const [userName, setUserName] = useState('Ali Raza');
  const [phone, setPhone] = useState('');
  const [currentChat, setCurrentChat] = useState(null);
  const [statusIndex, setStatusIndex] = useState(null);
  const [transition, setTransition] = useState('');

  const navigate = useCallback((s, extra) => {
    setTransition('fade-in');
    setScreen(s);
    if (extra?.chat) setCurrentChat(extra.chat);
    if (extra?.statusIdx) setStatusIndex(extra.statusIdx);
  }, []);

  const back = useCallback(() => {
    if (['phone','otp'].includes(screen)) setScreen('welcome');
    else if (screen === 'profile') setScreen('otp');
    else if (['chat','settings'].includes(screen)) { setCurrentChat(null); setScreen('chats'); }
    else if (screen === 'audiocall' || screen === 'videocall') { setScreen('chat'); }
    else if (screen === 'statusview') { setStatusIndex(null); setScreen('updates'); }
    else if (screen === 'welcome') setScreen('splash');
    else setScreen('chats');
  }, [screen]);

  const chatList = F.chats.map(c => ({ ...c, initials: c.name.split(' ').map(w=>w[0]).filter((_,i,a)=>i===0||i===a.length-1).join('').toUpperCase().slice(0,2) }));

  const renderScreen = () => {
    switch (screen) {
      case 'splash': return <SplashScreen key="splash" onDone={() => setScreen('welcome')} />;
      case 'welcome': return <WelcomeScreen key="welcome" onAgree={() => setScreen('phone')} />;
      case 'phone': return <PhoneScreen key="phone" onBack={() => setScreen('welcome')} onNext={(p) => { setPhone(p); setScreen('otp'); }} />;
      case 'otp': return <OtpScreen key="otp" phone={phone} onBack={() => setScreen('phone')} onVerified={() => setScreen('profile')} />;
      case 'profile': return <ProfileSetup key="profile" onDone={(n) => { setUserName(n); setScreen('chats'); }} />;
      case 'chats': return <ChatsScreen key="chats" chats={chatList} onChat={(c) => navigate('chat',{chat:c})} onSettings={() => setScreen('settings')} onTab={(t) => t === 'chats' ? null : navigate(t)} />;
      case 'chat': return <ChatScreen key={`chat-${currentChat?.id}`} chat={currentChat || chatList[0]} onBack={back} onAudioCall={() => setScreen('audiocall')} onVideoCall={() => setScreen('videocall')} onContactDetail={() => alert(`👤 ${currentChat?.name || 'Contact'} details`)} />;
      case 'audiocall': return <AudioCallScreen key="audiocall" contact={currentChat || chatList[0]} onEnd={back} />;
      case 'videocall': return <VideoCallScreen key="videocall" contact={currentChat || chatList[0]} onEnd={back} />;
      case 'updates': return <StatusScreen key="updates" statusList={F.statusList} onViewStatus={(i) => navigate('statusview',{statusIdx:i})} onTab={(t) => navigate(t)} />;
      case 'statusview': return <StatusViewer key={`sv-${statusIndex}`} statuses={F.statusList} index={statusIndex} onClose={() => { setStatusIndex(null); setScreen('updates'); }} />;
      case 'calls': return <CallsScreen key="calls" calls={F.calls} onCall={(name, color) => { const ch = chatList.find(c => c.name === name); setCurrentChat(ch || { name, initials: name[0], color }); setScreen('audiocall'); }} onTab={(t) => navigate(t)} />;
      case 'communities': return <CommunitiesScreen key="comm" onTab={(t) => navigate(t)} />;
      case 'settings': return <SettingsScreen key="settings" userName={userName} onBack={back} />;
      default: return <ChatsScreen key="default" chats={chatList} onChat={(c) => navigate('chat',{chat:c})} onSettings={() => setScreen('settings')} onTab={(t) => navigate(t)} />;
    }
  };

  return (
    <div style={{position:'relative',width:'100%',height:'100%',overflow:'hidden',background:'#fff'}} className={transition}>
      {renderScreen()}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
