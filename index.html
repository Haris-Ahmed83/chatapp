<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Chato - Secure Real-Time Chat">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Chato">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Chato</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
      color: #666;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #fff;
      z-index: 9999;
    }
    #loading.hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="loading">Loading Chato...</div>
  <script>
    window.addEventListener('load', function() {
      var checkApp = setInterval(function() {
        var canvas = document.querySelector('flt-scene, canvas');
        if (canvas) {
          clearInterval(checkApp);
          document.getElementById('loading').classList.add('hidden');
        }
      }, 100);
      setTimeout(function() {
        clearInterval(checkApp);
        document.getElementById('loading').classList.add('hidden');
      }, 15000);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
