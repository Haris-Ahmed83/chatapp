name: Build APK + Deploy Web

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.2

      - run: flutter pub get

      - name: Restore or generate keystore
        id: keystore
        uses: actions/cache@v4
        with:
          path: android/app/keystore.jks
          key: keystore-${{ runner.os }}

      - name: Generate keystore if missing
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkey -v -keystore android/app/keystore.jks -alias chato -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Chato,OU=,O=Chato,L=,S=,C=PK" -storepass chato123 -keypass chato123

      - name: Extract SHA fingerprints
        run: |
          echo "=== SHA-1 ==="
          keytool -list -v -keystore android/app/keystore.jks -alias chato -storepass chato123 2>/dev/null | grep -E "SHA1:|SHA-1:" | awk '{print $NF}'
          echo "=== SHA-256 ==="
          keytool -list -v -keystore android/app/keystore.jks -alias chato -storepass chato123 2>/dev/null | grep -E "SHA256:|SHA-256:" | awk '{print $NF}'
          echo "---"
          echo "Add these SHA fingerprints to Firebase Console at:"
          echo "https://console.firebase.google.com/project/chatapp-8a2d9/settings/general/android:com.example.chato"

      - name: Build APK
        run: flutter build apk --release
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: chato123
          KEY_ALIAS: chato
          KEY_PASSWORD: chato123

      - name: Build Web
        run: flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Deploy to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.name "Haris-Ahmed83"
          git config --global user.email "haris@example.com"
          git clone https://Haris-83:$HF_TOKEN@huggingface.co/spaces/Haris-83/chato hf-space
          cd hf-space
          rm -rf *
          cp -r ../build/web/* .
          rm -rf canvaskit
          echo '---' > README.md
          echo 'title: Chato' >> README.md
          echo -e 'emoji: \U0001F4AC' >> README.md
          echo 'colorFrom: green' >> README.md
          echo 'colorTo: blue' >> README.md
          echo 'sdk: static' >> README.md
          echo 'pinned: false' >> README.md
          echo '---' >> README.md
          git add -A
          git diff --cached --quiet || {
            git commit -m "auto-deploy from GitHub Actions"
            git push
          }
