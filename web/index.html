<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Chato - Secure Real-Time Chat">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chato">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chato</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #075E54; }
    #loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
      background: #075E54;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    #loading.fade-out { opacity: 0; pointer-events: none; }
    #loading.error .loader-title { color: #ff6b6b; }
    #loading.error .loader-sub { display: block; }
    .loader-icon {
      font-size: 72px;
      margin-bottom: 24px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .loader-title {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .loader-sub {
      display: none;
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 32px;
    }
    .loader-dots {
      display: flex;
      gap: 8px;
      margin-bottom: 32px;
    }
    .loader-dots span {
      width: 10px;
      height: 10px;
      background: #25D366;
      border-radius: 50%;
      animation: dotBounce 1.2s ease-in-out infinite;
    }
    .loader-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loader-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    @keyframes dotBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-12px); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loader-icon">💬</div>
    <div class="loader-title">Chato</div>
    <div class="loader-dots"><span></span><span></span><span></span></div>
    <div class="loader-sub"></div>
  </div>
  <script>
    var loadingEl = document.getElementById('loading');
    var subEl = loadingEl.querySelector('.loader-sub');

    function hideLoading() {
      loadingEl.classList.remove('error');
      loadingEl.classList.add('fade-out');
      subEl.textContent = '';
    }

    window.flutterReady = hideLoading;

    // Fallback: hide after 12s
    var fallbackTimer = setTimeout(hideLoading, 12000);

    // Error detection
    window.addEventListener('error', function(e) {
      if (loadingEl && !loadingEl.classList.contains('fade-out')) {
        loadingEl.classList.add('error');
        subEl.textContent = 'Connection issue. Retrying...';
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
