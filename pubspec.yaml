name: chato
description: A secure real-time chat application built with Flutter and Supabase.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  supabase_flutter: ^2.12.4
  flutter_dotenv: ^6.0.0
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.4.1
  image_picker: ^1.2.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - .env
